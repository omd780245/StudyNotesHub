<!DOCTYPE html>
<html>

<head>
<title>Class 10 Notes</title>

<style>

body{
    font-family: Arial, sans-serif;
    background-color:#f0f8ff;
    margin:0;
    text-align:center;
}

.navbar{
    background-color:darkblue;
    padding:15px;
}

.navbar a{
    color:white;
    text-decoration:none;
    margin:10px;
    font-weight:bold;
}

.subject{
    background:white;
    width:80%;
    max-width:300px;
    margin:20px auto;
    padding:20px;
    border-radius:15px;
    box-shadow:0px 0px 10px gray;
}

.subject a{
    text-decoration:none;
    color:white;
    background:blue;
    padding:10px 20px;
    border-radius:8px;
    display:inline-block;
}

.footer{
    background:darkblue;
    color:white;
    padding:15px;
    margin-top:30px;
}
.dark-mode{
    background:#121212;
    color:white;
}

.dark-mode .subject{
    background:#1e1e1e;
    color:white;
}

.dark-mode .subject h2{
    color:white;
}

.dark-mode .subject p{
    color:#cccccc;
}

.dark-mode .navbar,
.dark-mode .footer{
    background:#111;
}
.chapter-card{
    background:white;
    width:80%;
    max-width:500px;
    margin:20px auto;
    padding:25px;
    border-radius:20px;
    box-shadow:0px 0px 10px gray;
}
.chapter-card h3{
    margin-bottom:20px;
}

.chapter-card a{
    text-decoration:none;
    color:white;
    background:#1565c0;
    padding:12px 25px;
    border-radius:10px;
    display:inline-block;
    margin-top:10px;
    font-weight:bold;
}
.chapter-card{
    background:white;
    width:85%;
    max-width:500px;
    margin:20px auto;
    padding:25px;
    border-radius:20px;
    box-shadow:0px 4px 12px rgba(0,0,0,0.15);
    transition:0.3s;
}

.chapter-card:hover{
    transform:translateY(-3px);
}
</style>

</head>

<body>

<div class="navbar">

<a href="index.html">Home</a>

<a href="Class10.html">Class 10</a>

<a href="Class11.html">Class 11</a>

<a href="Class12.html">Class 12</a>

</div>

<div id="pageHeader">

<h1>📘 Class 10 Notes</h1>

<p>Select a Subject</p>

</div>

<div id="subjectsArea">
<div class="subject">

<h2>Mathematics</h2>

<p>Chapter-wise Mathematics Notes</p>

<a href="#" onclick="showSubject('Mathematics'); return false;">
Open
</a>

</div>

<div class="subject">

<h2>Science</h2>

<p>Physics, Chemistry and Biology Notes</p>

<a href="#" onclick="showSubject('Science'); return false;">
Open
</a>

</div>

<div class="subject">

<h2>English</h2>

<p>Grammar and Literature Notes</p>

<a href="#" onclick="showSubject('English'); return false;">
Open
</a>

</div>

<div class="subject">

<h2>Social Science</h2>

<p>History, Geography and Civics Notes</p>

<a href="#" onclick="showSubject('Social Science'); return false;">
Open
</a>

</div>
</div>
<div id="notesArea">

</div>
<div class="footer">

<a href="index.html" style="color:white;">⬅ Back to Home</a>

</div>
<script>
window.onload = function(){

    let theme = localStorage.getItem("theme");

    if(theme === "dark"){
        document.body.classList.add("dark-mode");
    }

}
</script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyCEmCezyyc0mq03KXi89raWu8iO13pfbYk",
  authDomain: "study-notes-hub-7ac7e.firebaseapp.com",
  databaseURL: "https://study-notes-hub-7ac7e-default-rtdb.firebaseio.com",
  projectId: "study-notes-hub-7ac7e",
  storageBucket: "study-notes-hub-7ac7e.firebasestorage.app",
  messagingSenderId: "286577611912",
  appId: "1:286577611912:web:6efb8badfcb473b749fb3d"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();
function showSubject(subject){

document.getElementById("subjectsArea").style.display = "none";
document.getElementById("pageHeader").style.display = "none";

document.getElementById("notesArea").innerHTML =
"<h2>📚 " + subject + " Notes</h2><p>Loading...</p>";

db.ref("notes").once("value")
.then(function(snapshot){

let data = snapshot.val();

let html = "<h2>📚 " + subject + " Notes</h2>";
let found = false;

for(let id in data){

if(
data[id].class === "Class 10" &&
data[id].subject === subject
){

found = true;

html += `
<div class="chapter-card">
<h3>${data[id].chapter}</h3>

<a href="${data[id].pdf}" target="_blank">
📄 Open PDF
</a>

</div>
`;

}

}
if(!found){

html += `
<p>No notes available yet.</p>
`;

}
html += `
<button onclick="backToSubjects()">
⬅ Back to Subjects
</button>
`;

document.getElementById("notesArea").innerHTML = html;

});

}
function backToSubjects(){

document.getElementById("subjectsArea").style.display = "block";
document.getElementById("pageHeader").style.display = "block";

document.getElementById("notesArea").innerHTML = "";

}

</script>
</body>

</html>
