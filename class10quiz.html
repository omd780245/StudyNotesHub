<h1>📝 Class 10 Quiz</h1>

<p>Select a chapter:</p>

<button class="chapter-btn" onclick="loadQuiz('letter')">A Letter to God</button>
<button class="chapter-btn" onclick="loadQuiz('mandela')">Nelson Mandela</button>

<hr>

Select a chapter above to begin the quiz.
</p>

</div>
<script>
  let currentQuestion = 0;
let score = 0;
const letterQuiz = [

{
question:"Who wrote A Letter to God?",
options:["Nelson Mandela","G. L. Fuentes","Anne Frank","Lencho"],
answer:1
},

{
question:"Who was the main character of the story?",
options:["Mandela","Lencho","Postmaster","Gregorio"],
answer:1
}
,
{
question:"What destroyed Lencho's crops?",
options:["Flood","Earthquake","Hailstorm","Drought"],
answer:2
},

{
question:"To whom did Lencho write a letter?",
options:["Postmaster","God","Mayor","Friend"],
answer:1
},

{
question:"How much money did Lencho ask for?",
options:["50 pesos","70 pesos","100 pesos","200 pesos"],
answer:2
},

{
question:"Who collected money for Lencho?",
options:["Villagers","Teacher","Postmaster","Mayor"],
answer:2
},

{
question:"How much money did Lencho actually receive?",
options:["70 pesos","100 pesos","50 pesos","30 pesos"],
answer:0
},

{
question:"What did Lencho think about the missing money?",
options:["Lost in mail","Taken by post office employees","Taken by God","Stolen by villagers"],
answer:1
},

{
question:"What kind of farmer was Lencho?",
options:["Rich","Careless","Hardworking","Lazy"],
answer:2
},

{
question:"Why did Lencho need money?",
options:["To buy land","To help family","To sow his fields again","To travel"],
answer:2
}
];

function loadQuiz(chapter){

let html = "";

if(chapter === "letter"){

currentQuestion = 0;
score = 0;
showLetterQuestion();
return;
}
if(chapter === "mandela"){

html = `
<h2>Nelson Mandela Quiz</h2>

<p>1. How many years did Nelson Mandela spend in prison?</p>

<input type="radio" name="q1" value="wrong"> 15 years<br>
<input type="radio" name="q1" value="correct"> 27 years<br>
<input type="radio" name="q1" value="wrong"> 30 years<br>
<input type="radio" name="q1" value="wrong"> 35 years<br>

<br>

<button onclick="checkAnswer()">Submit</button>

<p id="result"></p>

`;
}

document.getElementById("quizArea").innerHTML = html;

}
function checkAnswer(){

let answer =
document.querySelector('input[name="q1"]:checked');

if(!answer){
alert("Please select an answer");
return;
}

if(answer.value === "correct"){
document.getElementById("result").innerHTML =
"✅ Correct Answer";
}else{
document.getElementById("result").innerHTML =
"❌ Wrong Answer";
}

}
function showLetterQuestion(){

let q = letterQuiz[currentQuestion];

let html = `
<h2>A Letter to God Quiz</h2>

<p>Question ${currentQuestion + 1} of ${letterQuiz.length}</p>
<div style="background:#ddd;border-radius:10px;height:12px;margin:15px 0;">
  <div style="
    background:#1e88e5;
    width:${((currentQuestion+1)/letterQuiz.length)*100}%;
    height:12px;
    border-radius:10px;
  "></div>
</div>

<p>${q.question}</p>

<button onclick="checkLetterAnswer(0)">${q.options[0]}</button><br><br>

<button onclick="checkLetterAnswer(1)">${q.options[1]}</button><br><br>

<button onclick="checkLetterAnswer(2)">${q.options[2]}</button><br><br>

<button onclick="checkLetterAnswer(3)">${q.options[3]}</button><br><br>

`;

document.getElementById("quizArea").innerHTML = html;

}
function checkLetterAnswer(selected){

if(selected === letterQuiz[currentQuestion].answer){
score++;
}

currentQuestion++;

if(currentQuestion < letterQuiz.length){

showLetterQuestion();

}else{

let percent = Math.round((score / letterQuiz.length) * 100);

document.getElementById("quizArea").innerHTML = `
<h2>🎉 Quiz Completed</h2>

<p><b>Score:</b> ${score}/${letterQuiz.length}</p>

<p><b>Percentage:</b> ${percent}%</p>

<button onclick="loadQuiz('letter')">
🔄 Retake Quiz
</button>
`;

}

}
function loadTheme(){

let theme = localStorage.getItem("theme");

if(theme === "dark"){
document.body.classList.add("dark-mode");
}

}
