<!DOCTYPE html>
<html>
<head>
<title>Admin Login | Study Notes Hub</title>

<style>
body{
    background:#dfe8ef;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.login-box{
    background:white;
    padding:30px;
    border-radius:20px;
    width:320px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

input{
    width:90%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:10px;
}

button{
    background:#1565c0;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
}

button:hover{
    background:#0d47a1;
}
</style>

</head>

<body>

<div class="login-box">

<h2>🔐 Admin Login</h2>

<input type="email" id="email" placeholder="Email">

<input type="password" id="password" placeholder="Password">

<button onclick="login()">Login</button>

</div>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>

const firebaseConfig = {
  apiKey: "AIzaSyCEmCezyyc0mq03KXi89raWu8iO13pfbYk",
  authDomain: "study-notes-hub-7ac7e.firebaseapp.com",
  databaseURL: "https://study-notes-hub-7ac7e-default-rtdb.firebaseio.com",
  projectId: "study-notes-hub-7ac7e",
  storageBucket: "study-notes-hub-7ac7e.firebasestorage.app",
  messagingSenderId: "286577611912",
  appId: "1:286577611912:web:6efb8badfcb473b749fb3d",
  measurementId: "G-VHN6Y83HZ5"
};

firebase.initializeApp(firebaseConfig);
function login(){

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

firebase.auth()
.signInWithEmailAndPassword(email,password)

.then(function(){

window.location.href = "dashboard.html";

})

.catch(function(error){

alert(error.message);

});

}

</script>
</body>
</html>
